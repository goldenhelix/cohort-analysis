# yaml-language-server: $schema=https://www.schemastore.org/any.json
name: Cohort Annotation Track Updater
description: |-
  # Cohort Merge

  Combines per-manifest intermediate TSFs into the final cohort allele-frequency
  TSF via gautil's additiveCountAlleles transform. When
  include_reference_confident_loci is false the historical any(AlleleCounts > 0)
  filter is reapplied.

  ## Important Note
  Invoked by the "Build Cohort Annotation Track" workflow, not run directly.

agent_requirements:
  cpu_cores: 16
  memory_gb: 16

parameters:
  - name: manifest_parameter_file
    type: file
    label: Manifest List
    help: manifest_list.csv from the manifest stage
    pattern_match: ["*.csv"]

  - name: cohort_name
    type: string
    label: Cohort Name
    help: Resolved by the manifest stage.

  - name: series_name
    type: string
    label: Series Name
    help: Resolved by the manifest stage.

  - name: existing_counts
    type: string
    label: Existing Counts Path
    help: Resolved by the manifest stage. Empty for new cohorts.
    value: ""
    optional: true

  - name: sample_name_threshold
    label: Sample Name Threshold
    type: integer
    value: 20
    optional: true

  - name: include_reference_confident_loci
    label: Include Reference-Confident Loci
    type: boolean
    value: true
    optional: true

  - name: out_file
    type: file
    label: Output File Override
    help: Workspace-relative override for the output TSF path.
    group: "Advanced Options"
    create: true
    optional: true

steps:
  - name: final_merge
    description: Combine per-manifest TSFs into the cohort track.
    type: cmd
    command: bash
    args:
      - |- # shell
        #!/usr/bin/env bash
        set -ex
        python3 -u "${TASK_DIR}/../scripts/cohort_merge.py" \
          --manifest-parameter-file "${manifest_parameter_file}" \
          --cohort-name "${cohort_name}" \
          --series-name "${series_name}" \
          --existing-counts "${existing_counts}" \
          --sample-name-threshold "${sample_name_threshold}" \
          --include-reference-confident-loci "${include_reference_confident_loci}" \
          --out-file "${out_file}"
