# yaml-language-server: $schema=https://www.schemastore.org/any.json
name: Cohort Manifest Generator
description: |-
  Resolves the effective cohort identity (cohort_name, series_name,
  existing_counts), validates input VCF headers against the active thresholds,
  classifies the cohort as gVCF or joint, and writes per-batch manifest files.

  ## Important Note
  This task is not intended to be run directly. Use the "Build Cohort
  Annotation Track" workflow instead.

agent_requirements:
  cpu_cores: 0
  memory_gb: 0

parameters:
  - name: input_directory
    type: directory
    label: VCF Input Directory
    help: Directory containing *.vcf.gz files to add to the cohort.
    supports_location_mode: 'read_only'

  - name: cohort_name
    type: string
    label: Cohort Name
    help: >-
      Display name for the cohort (becomes the variant-frequency source name
      shown in VarSeq). Required when starting a new cohort. Ignored when an
      existing cohort TSF is selected — the value from its metadata is used
      and the override is logged.
    value: ""
    optional: true

  - name: series_name
    type: string
    label: Series Name
    help: >-
      Series identifier used as the cohort TSF filename stem and as the
      seriesName in TSF metadata. If blank when starting a new cohort, it is
      auto-derived by slugifying the cohort name (lowercase, spaces to
      underscores). Ignored when an existing cohort TSF is selected.
    value: ""
    optional: true

  - name: existing_counts
    type: file
    label: Existing Cohort TSF (to update)
    help: >-
      Optional. Pick a prior cohort TSF to add samples to it; its
      cohort_name and series_name will override anything typed above.
      Leave blank to create a new cohort or to auto-discover the latest
      TSF matching the typed series_name.
    pattern_match: ["*.tsf"]
    optional: true

  - name: min_qual
    type: integer
    label: Minimum QUAL
    help: Site-level QUAL floor. 0 disables.
    value: 10
    optional: true

  - name: min_dp
    type: integer
    label: Minimum DP
    help: Per-sample DP floor. 0 disables. DP must be declared in every input VCF header when > 0.
    value: 3
    optional: true

  - name: min_gq
    type: integer
    label: Minimum GQ
    help: Per-sample GQ floor. 0 disables. GQ must be declared in every input VCF header when > 0.
    value: 10
    optional: true

  - name: include_reference_confident_loci
    type: boolean
    label: Include Reference-Confident Loci (gVCF)
    help: >-
      When true (default), gVCF reference-confident blocks are preserved;
      when false, the historical any(AlleleCounts > 0) filter is reapplied
      post-merge and zero-count loci are dropped.
    value: true
    optional: true

  - name: merge_step_file_count
    type: integer
    label: Files Per Merge Batch
    help: Number of VCFs processed per vcf_merge invocation.
    value: 128
    optional: true

steps:
  - name: create_manifest
    description: Resolve identity, validate headers, write manifests.
    type: cmd
    command: bash
    args:
      - |- # shell
        #!/usr/bin/env bash
        set -e

        output_directory="$(pwd)"
        mkdir -p "${output_directory}"

        resolved_env="${output_directory}/resolved.env"

        python3 -u "${TASK_DIR}/../scripts/create_manifest_files.py" \
          --input-directory "${input_directory}" \
          --cohort-name "${cohort_name}" \
          --series-name "${series_name}" \
          --existing-counts "${existing_counts}" \
          --min-qual "${min_qual}" \
          --min-dp "${min_dp}" \
          --min-gq "${min_gq}" \
          --include-reference-confident-loci "${include_reference_confident_loci}" \
          --files-per-manifest "${merge_step_file_count}" \
          --emit-env "${resolved_env}"

        # Seems to help I/O stability across agents
        echo "Working directory: $(pwd), contains $(ls -la .)"

        output_directory_rel="${output_directory#${WORKSPACE_DIR}/}"
        output_manifest_list_rel="${output_directory}/manifest_list.csv"
        output_manifest_list_rel="${output_manifest_list_rel#${WORKSPACE_DIR}/}"

        {
          echo "output_directory=${output_directory_rel}"
          echo "output_manifest_list=${output_manifest_list_rel}"
          cat "${resolved_env}"
        } > result.env

        echo "Output Parameters:"
        cat result.env
