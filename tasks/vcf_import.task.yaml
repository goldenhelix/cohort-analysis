# yaml-language-server: $schema=https://www.schemastore.org/any.json
name: Cohort Annotation Track Updater
description: |-
  # Per-Batch VCF Merge

  Merges the VCFs listed in one manifest into an intermediate TSF. Filter
  expressions are composed from the typed thresholds (min_qual / min_dp /
  min_gq) per cohort type (gVCF vs joint).

  ## Important Note
  This task is invoked by the "Build Cohort Annotation Track" workflow per
  manifest batch, not run directly.

agent_requirements:
  cpu_cores: 32
  memory_gb: 64

parameters:
  - name: manifest_file
    type: file
    label: Manifest File
    help: One .manifest.txt listing VCFs for this batch
    pattern_match: ["*.txt"]

  - name: cohort_type
    type: string
    label: Cohort Type (gvcf|joint)
    help: Resolved by the manifest stage from VCF headers.

  - name: series_name
    type: string
    label: Series Name
    help: Resolved by the manifest stage.

  - name: min_qual
    label: Minimum QUAL
    type: integer
    value: 10
    optional: true

  - name: min_dp
    label: Minimum DP
    type: integer
    value: 3
    optional: true

  - name: min_gq
    label: Minimum GQ
    type: integer
    value: 10
    optional: true

  - name: include_reference_confident_loci
    label: Include Reference-Confident Loci
    type: boolean
    value: true
    optional: true

steps:
  - name: per_batch_merge
    description: Merge VCFs listed in one manifest into an intermediate TSF.
    type: cmd
    command: bash
    args:
      - |- # shell
        #!/usr/bin/env bash
        set -ex
        python3 -u "${TASK_DIR}/../scripts/vcf_merge.py" \
          --manifest-file "${manifest_file}" \
          --cohort-type "${cohort_type}" \
          --series-name "${series_name}" \
          --min-qual "${min_qual}" \
          --min-dp "${min_dp}" \
          --min-gq "${min_gq}" \
          --include-reference-confident-loci "${include_reference_confident_loci}"
