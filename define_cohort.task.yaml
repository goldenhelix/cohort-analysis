name: Define Cohort
description: Create or update a cohort definition file specifying the name, series, included samples, filtering rules, and annotation track parameters.

agent_requirements:
  cpu_cores: 0
  memory_gb: 0

parameters:
  - name: cohort_name
    type: string
    label: Cohort Name
    help: The name of the cohort to create
    value: "Cohort"

  - name: series_name
    type: string
    label: Series Name
    help: The name of the series to create
    value: "cohort"

  - name: sample_name_threshold
    type: integer
    label: Sample Name Threshold
    help: The maximum number of sample names to list for rare variants
    value: 20

  - name: merge_step_file_count
    type: integer
    label: The number of files to merge at a time in each vcf merge step
    help: This can be adjusted to ensure that the performance stays within the bounds of the runner
    value: 128

  - name: min_qual
    type: integer
    label: Minimum QUAL
    help: >-
      Site-level quality floor. Records with QUAL at or below this value are
      excluded from the cohort. Set to 0 to disable. Default 10 matches typical
      germline calling practice. On gVCF inputs, reference-confident blocks
      have no QUAL value and are handled via
      `include_reference_confident_loci` rather than this filter.
    value: 10
    optional: true

  - name: min_dp
    type: integer
    label: Minimum DP
    help: >-
      Per-sample read-depth floor. Samples with DP at or below this value are
      excluded from the allele-count tally for that record. Set to 0 to
      disable. Default 3 keeps samples with at least minimal coverage; raise
      for high-coverage cohorts or lower for exome/targeted panels. DP must
      be declared in every input VCF's FORMAT header or the run will fail
      up-front.
    value: 3
    optional: true

  - name: min_gq
    type: integer
    label: Minimum GQ
    help: >-
      Per-sample genotype-quality floor. Samples with GQ below this value are
      excluded from the allele-count tally for that record. Set to 0 to
      disable. Default 20 is the community-standard high-confidence genotype
      threshold. GQ must be declared in every input VCF's FORMAT header or
      the run will fail up-front.
    value: 20
    optional: true

  - name: include_reference_confident_loci
    type: boolean
    label: Include Reference-Confident Loci (gVCF)
    help: >-
      When true (default), loci where no sample in the cohort carries a
      variant allele are kept in the output. For gVCF inputs this preserves
      the "evidence of absence" signal carried by homozygous-reference blocks
      and is essential for meaningful allele-frequency denominators — a
      position with 0/100 alt alleles is different information than a
      position that was never sequenced. When false, the post-merge
      `any(AlleleCounts > 0)` filter is applied and zero-count loci are
      dropped from the output. Joint-called VCFs typically do not contain
      zero-count records, so this toggle is effectively a no-op for pure
      joint-VCF cohorts. Mixed gVCF / joint-VCF cohorts are not supported in
      a single run — split them into separate cohorts.
    value: true
    optional: true

steps:
  - name: create_cohort
    description: Create the initial cohort
    type: cmd
    command: bash
    args:
      - |- # shell
        #!/usr/bin/env bash
        set -e

        cohorts_folder="AppData/Common Data/UserAnnotations/cohorts"

        #
        # Parameters for track being created
        #
        sourceName="${cohort_name} Variant Frequencies"
        seriesName="${series_name}"

        #
        # Choose an output file base name and path. The base name will be extended with the current date and time.
        #
        out_file="${seriesName}.tsf"
        out_file="${cohorts_folder}/${out_file}"

        mkdir -p "${WORKSPACE_DIR}/${cohorts_folder}"
        out_parameter_file="${WORKSPACE_DIR}/${cohorts_folder}/${seriesName}-${cohort_name}.params.txt"

        echo "cohort_name=${cohort_name}" > "${out_parameter_file}"
        echo "series_name=${series_name}" >> "${out_parameter_file}"
        echo "out_file=${out_file}" >> "${out_parameter_file}"
        echo "sample_name_threshold=${sample_name_threshold}" >> "${out_parameter_file}"
        echo "min_qual=${min_qual}" >> "${out_parameter_file}"
        echo "min_dp=${min_dp}" >> "${out_parameter_file}"
        echo "min_gq=${min_gq}" >> "${out_parameter_file}"
        echo "include_reference_confident_loci=${include_reference_confident_loci}" >> "${out_parameter_file}"
        echo "merge_step_file_count=${merge_step_file_count}" >> "${out_parameter_file}"

        echo "Settings file created ${out_parameter_file}:"
        cat "${out_parameter_file}"
